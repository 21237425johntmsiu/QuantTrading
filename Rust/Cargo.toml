[package]
name = "price_newdb"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "price_newdb"
path = "price_newDB.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
tch = "0.19"
libc = "0.2"
